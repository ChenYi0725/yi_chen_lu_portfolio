name: yi_chen_lu_protfolio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  google_fonts: ^6.2.1
  go_router: ^14.1.4
  url_launcher: ^6.3.1
  http: ^1.5.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


  fonts:
    - family: Fustat
      fonts:
        - asset: assets/font/Fustat-Regular.ttf
        - asset: assets/font/Fustat-Bold.ttf
          weight: 700
        - asset: assets/font/Fustat-Light.ttf
          weight: 300

